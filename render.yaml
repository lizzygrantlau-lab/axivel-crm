services:
  - type: web
    name: axivel-crm
    runtime: node
    plan: free
    branch: main
    buildCommand: node --test react-app/*.test.cjs react-app/*.test.mjs netlify/lib/*.test.mjs netlify/tests/*.test.mjs
    startCommand: node react-app/online-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CRM_PASSWORD
        sync: false
